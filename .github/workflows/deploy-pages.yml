name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch canonical learning data from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=1Niy2rwTONBdMiVqvzbes3Ermei2bKmbl&export=download&confirm=t" \
            -o data/course_data.json

      - name: Validate and build learning data
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('data/course_data.json','utf8'));
          for(const key of ['chapters','slides','knowledge','questionBank'])if(!Array.isArray(data[key])||!data[key].length)throw new Error(`Missing ${key}`);
          const uniq=(arr,key,label)=>{const ids=arr.map(x=>x[key]);if(new Set(ids).size!==ids.length)throw new Error(`${label} duplicate IDs`)};
          uniq(data.chapters,'id','chapters');uniq(data.knowledge,'id','knowledge');uniq(data.questionBank,'id','questions');
          const slideKeys=data.slides.map(s=>`${s.day}-${s.slide}`);if(new Set(slideKeys).size!==slideKeys.length)throw new Error('duplicate slide keys');
          const expected={chapters:data.chapters.length,slides:data.slides.length,knowledge:data.knowledge.length,questions:data.questionBank.length};
          if(!data.counts)throw new Error('Missing counts metadata');
          for(const [key,val] of Object.entries(expected))if(Number(data.counts[key])!==val)throw new Error(`counts.${key} mismatch: ${data.counts[key]} vs ${val}`);
          const chapters=new Map(data.chapters.map(c=>[c.id,c])),knowledge=new Set(data.knowledge.map(k=>k.id));
          for(const k of data.knowledge){if(!chapters.has(k.chapter))throw new Error(`Knowledge ${k.id} invalid chapter`);if(!k.sourceLocation)throw new Error(`Knowledge ${k.id} missing source`)}
          for(const q of data.questionBank){if(!knowledge.has(q.knowledgeId))throw new Error(`Question ${q.id} invalid knowledge`);if(!q.sourceLocation)throw new Error(`Question ${q.id} missing source`)}
          for(const s of data.slides){if(!chapters.has(s.chapter))throw new Error(`Slide D${s.day} S${s.slide} invalid chapter`);if(!s.pdfPage)throw new Error(`Slide D${s.day} S${s.slide} missing PDF page`);for(const id of s.knowledgeIds||[])if(!knowledge.has(id))throw new Error(`Slide D${s.day} S${s.slide} invalid knowledge ${id}`)}
          for(const c of data.chapters){const ss=data.slides.filter(s=>s.chapter===c.id).map(s=>s.slide).sort((a,b)=>a-b);if(!ss.length)throw new Error(`${c.id} has no slide coverage`);if(ss[0]!==c.slideStart||ss[ss.length-1]!==c.slideEnd)throw new Error(`${c.id} slide range mismatch`);}
          const day1=data.slides.filter(s=>s.day===1),allowed=new Set(['CORE','CONTEXT','OPTIONAL','AUDIT_ONLY']);
          const bad=day1.filter(s=>!allowed.has(s.studyDisposition));if(bad.length)throw new Error(`Day1 invalid studyDisposition: ${bad.map(s=>s.slideLabel).join(',')}`);
          for(const label of ['S001','S002','S078']){const s=day1.find(x=>x.slideLabel===label);if(!s||s.studyDisposition!=='AUDIT_ONLY')throw new Error(`${label} must be AUDIT_ONLY`)}
          fs.writeFileSync('data/course_data.js',`window.COURSE_DATA=${JSON.stringify(data)};\n`);
          console.log(`DATA QA PASS: ${expected.chapters} chapters / ${expected.slides} slides / ${expected.knowledge} knowledge / ${expected.questions} questions`);
          NODE
          rm -f data/course_data.json

      - name: Product code QA
        run: |
          set -euo pipefail
          node --check assets/app.js
          node --check assets/learning-map.js
          node --check assets/coverage.js
          node --check assets/slide-preview.js
          node --check assets/insights.js
          node --check assets/runtime.js
          node --check assets/scoring.js
          node --check sw.js
          node --check data/course_data.js
          node --check data/slide_media.js
          node --check data/learning_map.js
          test -s assets/learning-map.css
          grep -q '#/map' index.html
          grep -q '課程學習地圖' index.html
          grep -q 'STUDENT GOD VIEW' assets/learning-map.js
          grep -q 'lm-day-spine' assets/learning-map.js
          grep -q 'lm-chapter-lane' assets/learning-map.js
          grep -q 'lm-knowledge-card' assets/learning-map.js
          grep -q '看原始教材' assets/learning-map.js
          grep -q 'window.LEARNING_MAP_DATA' data/learning_map.js
          ! grep -R -q 'learning_map_forms' index.html assets sw.js
          test ! -e data/learning_map_forms.js
          ! grep -R -q '人才發展閉環控制台' assets index.html
          ! grep -R -q '匯出工作簿' assets index.html
          ! grep -R -q '互動表單' assets index.html
          grep -q 'window.Coverage' assets/coverage.js
          grep -q 'window.SlidePreview' assets/slide-preview.js
          grep -q 'window.Insights' assets/insights.js
          grep -q 'window.TDRuntime' assets/runtime.js
          ! grep -R -q '已確認－無獨立考點' assets index.html
          ! grep -R -q 'product-fixes' assets index.html
          ! grep -R -q 'study-policy.js' assets index.html
          ! grep -R -q 'study-flow.js' assets index.html
          echo "PRODUCT QA PASS"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production smoke test
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          base="${PAGE_URL%/}"
          curl -L --fail --retry 4 --retry-delay 2 "$PAGE_URL" -o /tmp/index.html
          curl -L --fail --retry 4 --retry-delay 2 "$base/data/course_data.js" -o /tmp/course_data.js
          curl -L --fail --retry 4 --retry-delay 2 "$base/data/learning_map.js" -o /tmp/learning_map.js
          curl -L --fail --retry 4 --retry-delay 2 "$base/assets/learning-map.js" -o /tmp/learning-map.js
          curl -L --fail --retry 4 --retry-delay 2 "$base/assets/coverage.js" -o /tmp/coverage.js
          curl -L --fail --retry 4 --retry-delay 2 "$base/assets/runtime.js" -o /tmp/runtime.js
          grep -q '人才發展學習作業系統' /tmp/index.html
          grep -q '課程學習地圖' /tmp/index.html
          grep -q 'window.LEARNING_MAP_DATA' /tmp/learning_map.js
          grep -q 'STUDENT GOD VIEW' /tmp/learning-map.js
          grep -q 'lm-day-spine' /tmp/learning-map.js
          grep -q 'lm-knowledge-card' /tmp/learning-map.js
          ! grep -q 'learning_map_forms' /tmp/index.html
          ! grep -q '互動表單' /tmp/index.html
          grep -q 'window.COURSE_DATA' /tmp/course_data.js
          grep -q 'window.Coverage' /tmp/coverage.js
          grep -q 'window.TDRuntime' /tmp/runtime.js
          echo "PRODUCTION SMOKE PASS: $PAGE_URL"
