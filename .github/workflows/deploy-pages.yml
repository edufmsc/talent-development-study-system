name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch canonical learning data from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=1Niy2rwTONBdMiVqvzbes3Ermei2bKmbl&export=download&confirm=t" \
            -o data/course_data.json

      - name: Validate and build learning data
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),data=JSON.parse(fs.readFileSync('data/course_data.json','utf8'));
          const expected={chapters:40,slides:388,knowledge:172,questions:854},allowed=new Set(['CORE','CONTEXT','OPTIONAL','AUDIT_ONLY']);
          if(data.chapters.length!==expected.chapters||data.slides.length!==expected.slides||data.knowledge.length!==expected.knowledge||data.questionBank.length!==expected.questions)throw new Error('canonical counts mismatch');
          if(Number(data.counts?.auditedSlides)!==388||Number(data.counts?.pendingSlides)!==0)throw new Error('canonical audit counts invalid');
          const chapters=new Set(data.chapters.map(c=>c.id)),kids=new Set(data.knowledge.map(k=>k.id));
          for(const k of data.knowledge){if(!chapters.has(k.chapter)||!k.sourceLocation)throw new Error(`invalid Knowledge ${k.id}`)}
          for(const q of data.questionBank){if(!kids.has(q.knowledgeId)||!q.sourceLocation)throw new Error(`invalid Question ${q.id}`)}
          for(const s of data.slides){if(!allowed.has(s.studyDisposition))throw new Error(`unclassified D${s.day} ${s.slideLabel}`);if(s.studyDisposition==='CORE'&&!(s.knowledgeIds||[]).length)throw new Error(`CORE without Knowledge D${s.day} ${s.slideLabel}`);for(const id of s.knowledgeIds||[])if(!kids.has(id))throw new Error(`invalid slide Knowledge ${id}`)}
          fs.writeFileSync('data/course_data.js',`window.COURSE_DATA=${JSON.stringify(data)};\n`);
          console.log('DATA QA PASS: 388 audited / 0 pending');
          NODE
          rm -f data/course_data.json

      - name: Sync canonical mirror back to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/course_data.js; then echo "Canonical mirror already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/course_data.js
          git commit -m "Sync canonical course data [skip ci]"
          git push origin HEAD:main

      - name: Product code QA
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/app.js assets/learning-map.js assets/coverage.js assets/slide-preview.js assets/insights.js assets/decision-engine.js assets/decision-bridge.js assets/runtime.js assets/scoring.js sw.js data/course_data.js data/slide_media.js data/learning_map.js; do node --check "$f"; done
          for f in assets/learning-map.css assets/coverage.css assets/insights.css assets/hardening.css; do test -s "$f"; done
          grep -q 'assets/decision-engine.js' index.html
          grep -q 'assets/decision-bridge.js' index.html
          grep -q 'assets/hardening.css' index.html
          grep -q 'EXAM MICROCARD' assets/learning-map.js
          grep -q '人工指定教材節點' assets/learning-map.js
          ! grep -q 'textBlob' assets/learning-map.js
          ! grep -q 'splitAnswer' assets/learning-map.js
          ! grep -q 'keywords' data/learning_map.js
          grep -q 'knowledgeIds' data/learning_map.js
          grep -q 'slideIds' data/learning_map.js
          grep -q 'relationType' data/learning_map.js
          grep -q 'risk:null' assets/decision-engine.js
          grep -q 'coverageConfidence' assets/decision-engine.js
          ! grep -q '+1000' assets/decision-engine.js
          ! grep -q '+1000' assets/insights.js
          grep -q '同一考點' assets/decision-bridge.js
          grep -q 'schemaVersion:4' assets/insights.js
          grep -q 'rule-based-advisory' assets/scoring.js
          grep -q '不納入複習' assets/coverage.js
          grep -q 'if(isExcluded(s))return false' assets/runtime.js
          grep -q 'trust-hardening-v1' sw.js
          echo "PRODUCT QA PASS"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production smoke test
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"; stamp="$(date +%s)"
          for f in index.html data/course_data.js data/learning_map.js assets/learning-map.js assets/insights.js assets/decision-engine.js assets/decision-bridge.js assets/scoring.js assets/hardening.css sw.js; do
            curl -L --fail --retry 4 --retry-delay 2 "$base/$f?cb=$stamp" -o "/tmp/$(basename "$f")"
          done
          grep -q 'assets/decision-engine.js' /tmp/index.html
          grep -q 'curated-map-v1' /tmp/learning_map.js
          grep -q 'knowledgeIds' /tmp/learning_map.js
          ! grep -q 'keywords' /tmp/learning_map.js
          ! grep -q 'textBlob' /tmp/learning-map.js
          grep -q 'risk:null' /tmp/decision-engine.js
          grep -q 'coverageConfidence' /tmp/decision-engine.js
          grep -q '同一考點' /tmp/decision-bridge.js
          grep -q 'rule-based-advisory' /tmp/scoring.js
          grep -q 'overflow:visible!important' /tmp/hardening.css
          grep -q 'trust-hardening-v1' /tmp/sw.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),box={window:{}};vm.createContext(box);vm.runInContext(fs.readFileSync('/tmp/course_data.js','utf8'),box);vm.runInContext(fs.readFileSync('/tmp/learning_map.js','utf8'),box);const d=box.window.COURSE_DATA,m=box.window.LEARNING_MAP_DATA,allowed=new Set(['CORE','CONTEXT','OPTIONAL','AUDIT_ONLY']),kids=new Set(d.knowledge.map(k=>k.id));
          if(d.slides.length!==388||Number(d.counts?.pendingSlides)!==0)throw new Error('production canonical incomplete');
          if(d.slides.some(s=>!allowed.has(s.studyDisposition)))throw new Error('production unclassified slide');
          for(const s of m.stages)for(const c of s.children){if(!c.knowledgeIds?.length)throw new Error(`unmapped ${s.id}/${c.id}`);for(const id of c.knowledgeIds)if(!kids.has(id))throw new Error(`invalid map Knowledge ${id}`)}
          console.log('PRODUCTION TRUST QA PASS');
          NODE
          echo "PRODUCTION SMOKE PASS: $PAGE_URL"
