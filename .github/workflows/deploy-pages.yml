name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch canonical learning data from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=1Niy2rwTONBdMiVqvzbes3Ermei2bKmbl&export=download&confirm=t" \
            -o data/course_data.json

      - name: Validate and build learning data
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),data=JSON.parse(fs.readFileSync('data/course_data.json','utf8')),allowed=new Set(['CORE','CONTEXT','OPTIONAL','AUDIT_ONLY']);
          if(data.chapters.length!==40||data.slides.length!==388||data.knowledge.length!==172||data.questionBank.length!==854)throw new Error('canonical counts mismatch');
          if(Number(data.counts?.auditedSlides)!==388||Number(data.counts?.pendingSlides)!==0)throw new Error('canonical audit counts invalid');
          const kids=new Set(data.knowledge.map(k=>k.id));for(const q of data.questionBank)if(!kids.has(q.knowledgeId)||!q.sourceLocation)throw new Error(`invalid Question ${q.id}`);for(const s of data.slides){if(!allowed.has(s.studyDisposition))throw new Error(`unclassified D${s.day} ${s.slideLabel}`);if(s.studyDisposition==='CORE'&&!(s.knowledgeIds||[]).length)throw new Error(`CORE without Knowledge D${s.day} ${s.slideLabel}`);for(const id of s.knowledgeIds||[])if(!kids.has(id))throw new Error(`invalid slide Knowledge ${id}`)}
          const k=id=>data.knowledge.find(x=>x.id===id);if(!String(data.sources?.['2']?.url||'').includes('1XeQ2-m_l7uBy18kn2C_aDTb0siD75KQF'))throw new Error('Day2 source URL stale');if(!k('d5-21')?.answer.includes('評價反應'))throw new Error('d5-21 correction missing');if(!k('d5-29')?.answer.includes('人資部率先推動'))throw new Error('d5-29 correction missing');if(!k('d5-30')?.answer.includes('舉辦教育訓練'))throw new Error('d5-30 correction missing');
          fs.writeFileSync('data/course_data.js',`window.COURSE_DATA=${JSON.stringify(data)};\n`);console.log('DATA QA PASS');
          NODE
          rm -f data/course_data.json

      - name: Sync canonical mirror back to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/course_data.js; then echo "Canonical mirror already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/course_data.js
          git commit -m "Sync canonical course data [skip ci]"
          git push origin HEAD:main

      - name: Product code QA
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/app.js assets/learning-map.js assets/coverage.js assets/slide-preview.js assets/insights.js assets/decision-engine.js assets/decision-bridge.js assets/runtime.js assets/scoring.js sw.js data/course_data.js data/slide_media.js data/slide_atlas.js data/learning_map.js; do node --check "$f"; done
          for f in assets/learning-map.css assets/coverage.css assets/insights.css assets/slide-preview.css assets/hardening.css; do test -s "$f"; done
          grep -q 'data/slide_atlas.js' index.html
          grep -q 'assets/decision-engine.js' index.html
          grep -q '人工指定教材節點' assets/learning-map.js
          ! grep -q 'textBlob' assets/learning-map.js
          ! grep -q 'splitAnswer' assets/learning-map.js
          ! grep -q 'keywords' data/learning_map.js
          grep -q 'risk:null' assets/decision-engine.js
          grep -q 'coverageConfidence' assets/decision-engine.js
          ! grep -q '+1000' assets/decision-engine.js
          grep -q '同一考點' assets/decision-bridge.js
          grep -q 'schemaVersion:4' assets/insights.js
          grep -q 'rule-based-advisory' assets/scoring.js
          grep -q 'atlas-page-image' assets/slide-preview.js
          grep -q 'atlas-v1' sw.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),box={window:{}};vm.createContext(box);vm.runInContext(fs.readFileSync('data/slide_media.js','utf8'),box);vm.runInContext(fs.readFileSync('data/slide_atlas.js','utf8'),box);const d=box.window.SLIDE_MEDIA,a=box.window.SLIDE_ATLAS,expected={1:78,2:60,3:62,4:78,5:110};for(const [day,n] of Object.entries(expected)){const miss=Array.from({length:n},(_,i)=>`d${day}-s${String(i+1).padStart(3,'0')}`).filter(k=>day==='1'?!d.items?.[k]:!a.items?.[k]);if(miss.length)throw new Error(`D${day} exact preview missing ${miss.join(',')}`)}if(new Set(Object.values(a.atlases).map(x=>x.driveFileId)).size!==17)throw new Error('atlas file count must be 17');console.log('EXACT PREVIEW QA PASS 388/388');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production smoke test
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"; stamp="$(date +%s)"
          for f in index.html data/course_data.js data/learning_map.js data/slide_media.js data/slide_atlas.js assets/learning-map.js assets/slide-preview.js assets/insights.js assets/decision-engine.js assets/decision-bridge.js assets/scoring.js assets/hardening.css sw.js; do curl -L --fail --retry 4 --retry-delay 2 "$base/$f?cb=$stamp" -o "/tmp/$(basename "$f")"; done
          grep -q 'data/slide_atlas.js' /tmp/index.html
          grep -q 'day2-5-atlas-v1' /tmp/slide_atlas.js
          grep -q 'atlas-page-image' /tmp/slide-preview.js
          grep -q 'curated-map-v1' /tmp/learning_map.js
          ! grep -q 'keywords' /tmp/learning_map.js
          ! grep -q 'textBlob' /tmp/learning-map.js
          grep -q 'risk:null' /tmp/decision-engine.js
          grep -q 'coverageConfidence' /tmp/decision-engine.js
          grep -q '同一考點' /tmp/decision-bridge.js
          grep -q 'rule-based-advisory' /tmp/scoring.js
          grep -q 'overflow:visible!important' /tmp/hardening.css
          grep -q 'atlas-v1' /tmp/sw.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),box={window:{}};vm.createContext(box);for(const f of ['/tmp/course_data.js','/tmp/learning_map.js','/tmp/slide_media.js','/tmp/slide_atlas.js'])vm.runInContext(fs.readFileSync(f,'utf8'),box);const d=box.window.COURSE_DATA,m=box.window.LEARNING_MAP_DATA,media=box.window.SLIDE_MEDIA,atlas=box.window.SLIDE_ATLAS,kids=new Set(d.knowledge.map(k=>k.id));if(d.slides.length!==388||Number(d.counts?.pendingSlides)!==0)throw new Error('production canonical incomplete');for(const s of m.stages)for(const c of s.children){if(!c.knowledgeIds?.length)throw new Error(`unmapped ${s.id}/${c.id}`);for(const id of c.knowledgeIds)if(!kids.has(id))throw new Error(`invalid map Knowledge ${id}`)}for(const [day,n] of Object.entries({1:78,2:60,3:62,4:78,5:110})){const miss=Array.from({length:n},(_,i)=>`d${day}-s${String(i+1).padStart(3,'0')}`).filter(k=>day==='1'?!media.items?.[k]:!atlas.items?.[k]);if(miss.length)throw new Error(`production exact preview missing D${day}`)}const k=id=>d.knowledge.find(x=>x.id===id);if(!String(d.sources?.['2']?.url||'').includes('1XeQ2-m_l7uBy18kn2C_aDTb0siD75KQF'))throw new Error('production Day2 source stale');if(!k('d5-21')?.answer.includes('評價反應')||!k('d5-29')?.answer.includes('人資部率先推動')||!k('d5-30')?.answer.includes('舉辦教育訓練'))throw new Error('production Day5 correction missing');console.log('PRODUCTION TRUST + MEDIA QA PASS 388/388');
          NODE
          echo "PRODUCTION SMOKE PASS: $PAGE_URL"
