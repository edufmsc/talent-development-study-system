name: Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check assets/app.js
          node --check assets/learning-map.js
          node --check assets/coverage.js
          node --check assets/slide-preview.js
          node --check assets/insights.js
          node --check assets/runtime.js
          node --check assets/scoring.js
          node --check sw.js
          node --check data/course_data.js
          node --check data/slide_media.js
          node --check data/learning_map.js

      - name: Architecture invariants
        run: |
          set -euo pipefail
          test -s assets/learning-map.css
          test -s assets/coverage.css
          test -s assets/insights.css
          test -s assets/slide-preview.css
          grep -q '#/map' index.html
          grep -q 'data/learning_map.js' index.html
          grep -q 'assets/learning-map.js' index.html
          grep -q 'assets/learning-map.css' index.html
          grep -q 'assets/coverage.js' index.html
          grep -q 'assets/slide-preview.js' index.html
          grep -q 'assets/insights.js' index.html
          grep -q 'assets/runtime.js' index.html
          grep -q 'window.LearningMap' assets/learning-map.js
          grep -q "p\[0\]==='map'" assets/runtime.js
          grep -q 'window.LEARNING_MAP_DATA' data/learning_map.js
          grep -q 'window.Coverage' assets/coverage.js
          grep -q 'window.SlidePreview' assets/slide-preview.js
          grep -q 'window.Insights' assets/insights.js
          grep -q 'td-slide-coverage-v2' assets/coverage.js
          ! grep -R -q '已確認－無獨立考點' assets index.html
          ! grep -R -q 'product-fixes' assets index.html
          ! grep -R -q 'study-policy.js' assets index.html
          ! grep -R -q 'study-flow.js' assets index.html
          test ! -e assets/product-fixes.js
          test ! -e assets/product-fixes.css
          test ! -e assets/study-policy.js
          test ! -e assets/study-flow.js
          grep -q '五類考試掌握雷達' assets/insights.js
          ! grep -q '五大核心能力雷達' assets/insights.js
          grep -q '不代表完整的人才發展專業能力' assets/insights.js

      - name: Learning map integrity
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('data/learning_map.js','utf8');
          const box={window:{}};vm.createContext(box);vm.runInContext(code,box);
          const map=box.window.LEARNING_MAP_DATA;
          if(!map)throw new Error('LEARNING_MAP_DATA missing');
          const expected=['strategy','f01','f02','f03','f04','f05','f06','e07','f07','evidence','reassess'];
          const ids=map.systemFlow.map(x=>x.id);
          for(const id of expected)if(!ids.includes(id))throw new Error(`Learning map missing ${id}`);
          if(new Set(ids).size!==ids.length)throw new Error('Learning map duplicate node IDs');
          if(map.learningMapSteps.length!==8)throw new Error(`E07 Learning Map expected 8 steps, got ${map.learningMapSteps.length}`);
          if(map.transitionGaps.length!==3)throw new Error(`Transition Learning Map expected 3 priority gaps, got ${map.transitionGaps.length}`);
          const e07=map.systemFlow.find(x=>x.id==='e07');
          if(!e07||!e07.purpose.includes('F05')||!e07.purpose.includes('F07'))throw new Error('E07 bridge boundary missing');
          if(!map.sourceBoundary.includes('不以完成課程直接推論能力提升'))throw new Error('Evidence boundary missing');
          if(JSON.stringify(map).includes('drive.google.com/file/d/'))throw new Error('Private Drive file URLs must not be embedded in public learning map data');
          console.log('LEARNING MAP PASS: system flow + 8-step E07 + 3 priority gaps');
          NODE

      - name: Day1 content boundary
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('data/course_data.js','utf8');
          const box={window:{}};vm.createContext(box);vm.runInContext(code,box);
          const data=box.window.COURSE_DATA;
          if(!data)throw new Error('COURSE_DATA missing');
          const day1=data.slides.filter(s=>s.day===1),allowed=new Set(['CORE','CONTEXT','OPTIONAL','AUDIT_ONLY']);
          const bad=day1.filter(s=>!allowed.has(s.studyDisposition));if(bad.length)throw new Error(`Day1 invalid disposition: ${bad.map(s=>s.slideLabel).join(',')}`);
          for(const label of ['S001','S002','S078']){const s=day1.find(x=>x.slideLabel===label);if(!s||s.studyDisposition!=='AUDIT_ONLY')throw new Error(`${label} must be AUDIT_ONLY`)}
          const formalWrong=day1.filter(s=>String(s.auditStatus||'').includes('正式考點')&&(s.studyDisposition!=='CORE'||!(s.knowledgeIds||[]).length));if(formalWrong.length)throw new Error(`Formal page boundary failed: ${formalWrong.map(s=>s.slideLabel).join(',')}`);
          const contextK=day1.filter(s=>s.studyDisposition==='CONTEXT'&&(s.knowledgeIds||[]).length);if(contextK.length)throw new Error(`CONTEXT owns Knowledge: ${contextK.map(s=>s.slideLabel).join(',')}`);
          const flow=day1.filter(s=>['CORE','CONTEXT'].includes(s.studyDisposition));
          if(flow.some(s=>['S001','S002','S078'].includes(s.slideLabel)))throw new Error('AUDIT_ONLY page leaked into formal study flow');
          console.log(`DAY1 BOUNDARY PASS: ${day1.length} slides / formal flow ${flow.length}`);
          NODE

      - name: Day1 exact-slide media coverage
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('data/slide_media.js','utf8');
          const box={window:{}};vm.createContext(box);vm.runInContext(code,box);
          const media=box.window.SLIDE_MEDIA;
          if(!media?.items)throw new Error('SLIDE_MEDIA missing');
          const expected=Array.from({length:78},(_,i)=>`d1-s${String(i+1).padStart(3,'0')}`);
          const keys=Object.keys(media.items).filter(k=>k.startsWith('d1-s')).sort();
          const missing=expected.filter(k=>!media.items[k]);
          if(missing.length)throw new Error(`Day1 exact-slide media missing: ${missing.join(',')}`);
          if(keys.length!==78)throw new Error(`Day1 exact-slide media expected 78, got ${keys.length}`);
          const ids=expected.map(k=>media.items[k]?.driveFileId);
          if(ids.some(x=>!x))throw new Error('Day1 exact-slide media has blank Drive file ID');
          if(new Set(ids).size!==ids.length)throw new Error('Day1 exact-slide media has duplicate Drive file IDs');
          for(let i=1;i<=78;i++){
            const k=`d1-s${String(i).padStart(3,'0')}`;
            const expectedName=`D1_S${String(i).padStart(3,'0')}.jpg`;
            if(media.items[k]?.fileName!==expectedName)throw new Error(`${k} filename mismatch`);
          }
          console.log('DAY1 EXACT-SLIDE MEDIA PASS: 78/78');
          NODE
