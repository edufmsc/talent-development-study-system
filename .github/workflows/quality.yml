name: Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check assets/app.js
          node --check assets/learning-map.js
          node --check assets/coverage.js
          node --check assets/slide-preview.js
          node --check assets/insights.js
          node --check assets/runtime.js
          node --check assets/scoring.js
          node --check sw.js
          node --check data/course_data.js
          node --check data/slide_media.js
          node --check data/learning_map.js

      - name: Architecture invariants
        run: |
          set -euo pipefail
          test -s assets/learning-map.css
          grep -q '#/map' index.html
          grep -q '人才發展循環地圖' index.html
          grep -q 'data/learning_map.js' index.html
          grep -q 'assets/learning-map.js' index.html
          grep -q 'window.LearningMap' assets/learning-map.js
          grep -q "p\[0\]==='map'" assets/runtime.js
          grep -q 'TALENT DEVELOPMENT GOD VIEW' assets/learning-map.js
          grep -q 'lm-system-canvas' assets/learning-map.js
          grep -q 'lm-inline-detail' assets/learning-map.js
          grep -q 'lm-inline-output' assets/learning-map.js
          grep -q 'lm-flow-chain' assets/learning-map.js
          grep -q '#/slide/' assets/learning-map.js
          ! grep -R -q 'learning_map_forms' index.html assets sw.js
          test ! -e data/learning_map_forms.js
          ! grep -R -q '人才發展閉環控制台' assets index.html
          ! grep -R -q '匯出工作簿' assets index.html
          ! grep -R -q '互動表單' assets index.html
          ! grep -R -q '已確認－無獨立考點' assets index.html
          ! grep -R -q 'product-fixes' assets index.html
          ! grep -R -q 'study-policy.js' assets index.html
          ! grep -R -q 'study-flow.js' assets index.html
          grep -q '五類考試掌握雷達' assets/insights.js
          ! grep -q '五大核心能力雷達' assets/insights.js

      - name: Talent development lifecycle map integrity
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const box={window:{}};vm.createContext(box);
          vm.runInContext(fs.readFileSync('data/course_data.js','utf8'),box);
          vm.runInContext(fs.readFileSync('data/learning_map.js','utf8'),box);
          const d=box.window.COURSE_DATA,m=box.window.LEARNING_MAP_DATA;
          if(!d||!m)throw new Error('course/map data missing');
          const expected=['direction','system','standard','assessment','talent-decision','gap-map','development-design','development','review'];
          if(!Array.isArray(m.stages)||m.stages.length!==expected.length)throw new Error(`expected ${expected.length} lifecycle stages`);
          for(const id of expected){
            const s=m.stages.find(x=>x.id===id);if(!s)throw new Error(`missing stage ${id}`);
            if(!s.question||!s.inputs?.length||!s.process?.length||!s.outputs?.length||!s.rules?.length)throw new Error(`incomplete stage ${id}`);
            for(const o of s.outputs)if(!o.title||!o.flow?.length)throw new Error(`output flow missing ${id}/${o.id}`);
          }
          if(!m.officialBackbone?.includes('願景／使命')||!m.officialBackbone?.includes('OJT／SD'))throw new Error('official course backbone missing');
          for(const rule of ['Performance ≠ Potential；九宮格 ≠ Readiness。','證據不足 ≠ 能力低；先補證。','Gap ≠ Training Need；先判斷原因。','活動完成 ≠ 能力提升；要用新工作／行為證據回評。'])if(!m.universalRules?.includes(rule))throw new Error(`missing guardrail: ${rule}`);
          if(!m.returnLinks?.some(x=>x.from==='review'&&x.to==='gap-map'))throw new Error('review-to-gap loop missing');
          if(!m.returnLinks?.some(x=>x.from==='review'&&x.to==='talent-decision'))throw new Error('review-to-decision loop missing');
          for(const day of [1,2,3,4,5])if(!m.stages.some(s=>(s.sourceDays||[]).includes(day)))throw new Error(`Day ${day} not mapped as source`);
          if(d.chapters.length!==40)throw new Error(`expected 40 chapters, got ${d.chapters.length}`);
          console.log(`TALENT LIFECYCLE MAP PASS: ${m.stages.length} stages / ${d.chapters.length} chapters / ${d.knowledge.length} knowledge`);
          NODE

      - name: Day1 content boundary
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const box={window:{}};vm.createContext(box);vm.runInContext(fs.readFileSync('data/course_data.js','utf8'),box);
          const data=box.window.COURSE_DATA,day1=data.slides.filter(s=>s.day===1),allowed=new Set(['CORE','CONTEXT','OPTIONAL','AUDIT_ONLY']);
          const bad=day1.filter(s=>!allowed.has(s.studyDisposition));if(bad.length)throw new Error(`Day1 invalid disposition: ${bad.map(s=>s.slideLabel).join(',')}`);
          for(const label of ['S001','S002','S078']){const s=day1.find(x=>x.slideLabel===label);if(!s||s.studyDisposition!=='AUDIT_ONLY')throw new Error(`${label} must be AUDIT_ONLY`)}
          const formalWrong=day1.filter(s=>String(s.auditStatus||'').includes('正式考點')&&(s.studyDisposition!=='CORE'||!(s.knowledgeIds||[]).length));if(formalWrong.length)throw new Error(`Formal page boundary failed: ${formalWrong.map(s=>s.slideLabel).join(',')}`);
          console.log(`DAY1 BOUNDARY PASS: ${day1.length} slides`);
          NODE

      - name: Day1 exact-slide media coverage
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const box={window:{}};vm.createContext(box);vm.runInContext(fs.readFileSync('data/slide_media.js','utf8'),box);
          const media=box.window.SLIDE_MEDIA,expected=Array.from({length:78},(_,i)=>`d1-s${String(i+1).padStart(3,'0')}`);
          const missing=expected.filter(k=>!media?.items?.[k]);if(missing.length)throw new Error(`Day1 exact-slide media missing: ${missing.join(',')}`);
          if(new Set(expected.map(k=>media.items[k].driveFileId)).size!==78)throw new Error('Day1 media duplicate IDs');
          console.log('DAY1 EXACT-SLIDE MEDIA PASS: 78/78');
          NODE
