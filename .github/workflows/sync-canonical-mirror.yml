name: Sync Canonical Data Mirror

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-canonical-mirror.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch canonical learning data
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=1Niy2rwTONBdMiVqvzbes3Ermei2bKmbl&export=download&confirm=t" \
            -o /tmp/course_data.json

      - name: Validate canonical study policy and build mirror
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/course_data.json','utf8'));
          const day1=data.slides.filter(s=>s.day===1);
          const allowed=new Set(['CORE','CONTEXT','OPTIONAL','AUDIT_ONLY']);
          const bad=day1.filter(s=>!allowed.has(s.studyDisposition));
          if(bad.length) throw new Error(`Day1 missing studyDisposition: ${bad.map(s=>s.slideLabel).join(',')}`);
          const s1=day1.find(s=>s.slideLabel==='S001');
          const s2=day1.find(s=>s.slideLabel==='S002');
          const s78=day1.find(s=>s.slideLabel==='S078');
          for(const s of [s1,s2,s78]) if(!s||s.studyDisposition!=='AUDIT_ONLY') throw new Error('Audit-only guard failed');
          if(data.knowledge.length!==172||data.questionBank.length!==854||data.slides.length!==388) throw new Error('Canonical counts unexpected');
          fs.writeFileSync('data/course_data.js',`window.COURSE_DATA=${JSON.stringify(data)};\n`);
          console.log('CANONICAL MIRROR QA PASS');
          NODE

      - name: Commit mirror to main only when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/course_data.js; then
            echo "Mirror already matches canonical data"
            exit 0
          fi
          git add data/course_data.js
          git commit -m "Sync canonical course data mirror"
          git push origin HEAD:main
